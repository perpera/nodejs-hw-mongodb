tags:
  - Auth
summary: Register a new user
operationId: registerUser
description: Register a new user
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - name
          - password
        properties:
          email:
            type: string
            example: 'johndoe@example.com'
          name:
            type: string
            example: 'John Doe'
          password:
            type: string
            example: 'password123'
responses:
  '201':
    description: User registered successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a new user!
            data:
              $ref: ../../components/schemas/user.yaml
  '400':
    description: Bad request error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: BadRequestError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Invalid request data: email must be a valid email address'
  '409':
    description: Conflict error
    content:
      application/json:
       schema:
        type: object
        required:
        - status
        - message
        - data
        properties:
         status:
          type: integer
          example: 409
         message:
          type: string
          example: ConflictError
         data:
          type: object
          required:
            - message
          properties:
            message:
              type: string
              example: 'The email is already in use'
  '500':
    $ref: '../../components/responses/500.yaml'

tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: Remove a contact from the database by its id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '67dd4fb6c1e46079abca809c'
responses:
  '204':
    description: Contact deleted successfully
  '400':
    description: Bad request error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: BadRequestError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Invalid request data: contactId must be a valid ObjectId'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    description: Not found error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: NotFoundError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Contact not found'
  '500':
    $ref: '../../../components/responses/500.yaml'

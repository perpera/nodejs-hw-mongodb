# swagger/paths/contacts/{id}/get.yaml

tags:
  - Contacts
summary: Get contact by id
operationId: getContactById
description: Get contact by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
     type: string
     example: '65ca67e7ae7f10c88b598384'
     description: ID for getting a contact
responses:
  '200':
    description: Successfully fetched the contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact fetched successfully
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    description: Bad request error
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: BadRequestError
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Invalid request data: contactId must be a valid ObjectId'
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application\json:
       schema:
        type: object
        required:
          - status
          - message
        properties:
          status:
            type: integer
            example: 404
          message:
            type: string
            example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
